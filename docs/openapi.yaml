openapi: 3.1.0
info:
  title: AutoMind AI Backend API
  version: 1.0.0
  description: Bilingual mobile API for vehicle diagnostics, maintenance, mechanics, appointments, and notifications.
  license: {name: Proprietary, url: https://automind.example/terms}
servers:
  - url: https://automind-ai.net/api/v1
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - {name: System, description: Service health and version metadata.}
  - {name: Auth, description: Mobile identity and token lifecycle.}
  - {name: Account, description: Profile settings and registered devices.}
  - {name: Vehicles, description: Owned vehicles and catalog lookup.}
  - {name: Diagnostics, description: Evidence capture and queued analysis.}
  - {name: Reports, description: Safe bilingual reports and sourced estimates.}
  - {name: Maintenance, description: Service history and reminders.}
  - {name: Mechanics, description: Public verified mechanic discovery.}
  - {name: Appointments, description: Conflict-safe bookings and reviews.}
  - {name: Service Requests, description: Multi-workshop quotes, repair chat, and status tracking.}
  - {name: Notifications, description: User notification inbox.}
  - {name: Webhooks, description: Signature-verified provider callbacks.}
  - {name: Billing, description: Store catalog, verified purchases, entitlements, credits, and subscription lifecycle.}
  - {name: Admin Billing, description: Permission-protected billing catalog and support operations.}
  - {name: Admin, description: Role-protected production data operations.}
paths:
  /health:
    get: {tags: [System], operationId: getHealth, summary: "getHealth", security: [], parameters: [{$ref: '#/components/parameters/HealthType'}], responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Success'}}}
  /version:
    get: {tags: [System], operationId: getVersion, summary: "getVersion", security: [], responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
  /auth/register:
    post: {tags: [Auth], operationId: register, summary: "Create an account and send its phone OTP", security: [], requestBody: {$ref: '#/components/requestBodies/Register'}, responses: {'201': {$ref: '#/components/responses/OtpChallenge'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}}
  /auth/login:
    post: {tags: [Auth], operationId: login, summary: "Login or return OTP_REQUIRED for an unverified phone", security: [], requestBody: {$ref: '#/components/requestBodies/Login'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}}}
  /auth/otp/resend:
    post: {tags: [Auth], operationId: resendOtp, summary: "Resend a pending phone OTP", security: [], requestBody: {$ref: '#/components/requestBodies/OtpResend'}, responses: {'200': {$ref: '#/components/responses/OtpChallenge'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}}
  /auth/otp/verify:
    post: {tags: [Auth], operationId: verifyOtp, summary: "Verify a phone OTP and create a session", security: [], requestBody: {$ref: '#/components/requestBodies/OtpVerify'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '422': {$ref: '#/components/responses/Error'}, '429': {$ref: '#/components/responses/Error'}, '503': {$ref: '#/components/responses/Error'}}}
  /auth/social/google:
    post: {tags: [Auth], operationId: googleLogin, summary: "googleLogin", security: [], requestBody: {$ref: '#/components/requestBodies/SocialLogin'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /auth/social/apple:
    post: {tags: [Auth], operationId: appleLogin, summary: "appleLogin", security: [], requestBody: {$ref: '#/components/requestBodies/SocialLogin'}, responses: {'200': {$ref: '#/components/responses/Auth'}, '401': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /auth/forgot-password:
    post: {tags: [Auth], operationId: forgotPassword, summary: "forgotPassword", security: [], requestBody: {$ref: '#/components/requestBodies/Email'}, responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /auth/reset-password:
    post: {tags: [Auth], operationId: resetPassword, summary: "resetPassword", security: [], requestBody: {$ref: '#/components/requestBodies/ResetPassword'}, responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /auth/logout:
    post: {tags: [Auth], operationId: logout, summary: "logout", responses: {'204': {description: Logged out}, '401': {$ref: '#/components/responses/Error'}}}
  /auth/logout-all:
    post: {tags: [Auth], operationId: logoutAll, summary: "logoutAll", responses: {'204': {description: All tokens revoked}, '401': {$ref: '#/components/responses/Error'}}}
  /me:
    get: {tags: [Account], operationId: getMe, summary: "getMe", responses: {'200': {$ref: '#/components/responses/User'}, '401': {$ref: '#/components/responses/Error'}}}
    patch: {tags: [Account], operationId: updateMe, summary: "updateMe", requestBody: {$ref: '#/components/requestBodies/ProfileUpdate'}, responses: {'200': {$ref: '#/components/responses/User'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Account], operationId: deleteMe, summary: "deleteMe", responses: {'400': {$ref: '#/components/responses/Error'}, '204': {description: Deletion requested}}}
  /me/avatar:
    post: {tags: [Account], operationId: uploadAvatar, summary: "uploadAvatar", requestBody: {$ref: '#/components/requestBodies/Avatar'}, responses: {'200': {$ref: '#/components/responses/User'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Account], operationId: deleteAvatar, summary: "deleteAvatar", responses: {'400': {$ref: '#/components/responses/Error'}, '204': {description: Avatar removed}}}
  /settings:
    get: {tags: [Account], operationId: getSettings, summary: "getSettings", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
    patch: {tags: [Account], operationId: updateSettings, summary: "updateSettings", requestBody: {$ref: '#/components/requestBodies/SettingsUpdate'}, responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /devices:
    post: {tags: [Account], operationId: registerDevice, summary: "registerDevice", requestBody: {$ref: '#/components/requestBodies/Device'}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /devices/{deviceTokenId}:
    parameters: [{$ref: '#/components/parameters/DeviceTokenId'}]
    delete: {tags: [Account], operationId: deleteDevice, summary: "deleteDevice", responses: {'204': {description: Device removed}, '404': {$ref: '#/components/responses/Error'}}}
  /vehicle-catalog/makes:
    get: {tags: [Vehicles], operationId: listVehicleMakes, summary: "List all supported vehicle makes with locally hosted logos", security: [], responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/VehicleMakeList'}}}
  /vehicle-catalog/makes/{makeCode}/models:
    parameters: [{$ref: '#/components/parameters/MakeCode'}]
    get: {tags: [Vehicles], operationId: listVehicleModels, summary: "List catalog models; clients append Other when meta.customModelAllowed is true", security: [], parameters: [{name: year, in: query, schema: {type: integer}}], responses: {'200': {$ref: '#/components/responses/VehicleModelList'}, '404': {$ref: '#/components/responses/Error'}}}
  /vehicles:
    get: {tags: [Vehicles], operationId: listVehicles, summary: "listVehicles", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/VehicleList'}}}
    post: {tags: [Vehicles], operationId: createVehicle, summary: "createVehicle", requestBody: {$ref: '#/components/requestBodies/Vehicle'}, responses: {'201': {$ref: '#/components/responses/Vehicle'}, '422': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}:
    parameters: [{$ref: '#/components/parameters/VehicleId'}]
    get: {tags: [Vehicles], operationId: getVehicle, summary: "getVehicle", responses: {'200': {$ref: '#/components/responses/Vehicle'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}}
    patch: {tags: [Vehicles], operationId: updateVehicle, summary: "updateVehicle", requestBody: {$ref: '#/components/requestBodies/VehicleUpdate'}, responses: {'200': {$ref: '#/components/responses/Vehicle'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Vehicles], operationId: deleteVehicle, summary: "deleteVehicle", responses: {'204': {description: Vehicle deleted}, '409': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/selected:
    parameters: [{$ref: '#/components/parameters/VehicleId'}]
    put: {tags: [Vehicles], operationId: selectVehicle, summary: "selectVehicle", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Vehicle'}}}
  /vehicles/{vehicleId}/health:
    parameters: [{$ref: '#/components/parameters/VehicleId'}]
    get: {tags: [Vehicles], operationId: getVehicleHealth, summary: "getVehicleHealth", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
  /symptoms:
    get: {tags: [Diagnostics], operationId: listSymptoms, summary: "listSymptoms", security: [], responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
  /maintenance-service-definitions:
    get: {tags: [Maintenance], operationId: listMaintenanceServiceDefinitions, summary: "List localized active maintenance services", security: [], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /diagnoses:
    get: {tags: [Diagnostics], operationId: listDiagnoses, summary: "listDiagnoses", parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Diagnostics], operationId: createDiagnosis, summary: "createDiagnosis", parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Diagnosis'}, responses: {'201': {$ref: '#/components/responses/Diagnosis'}, '422': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    get: {tags: [Diagnostics], operationId: getDiagnosis, summary: "getDiagnosis", responses: {'200': {$ref: '#/components/responses/Diagnosis'}, '403': {$ref: '#/components/responses/Error'}}}
    patch: {tags: [Diagnostics], operationId: updateDiagnosis, summary: "updateDiagnosis", requestBody: {$ref: '#/components/requestBodies/DiagnosisUpdate'}, responses: {'200': {$ref: '#/components/responses/Diagnosis'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Diagnostics], operationId: deleteDiagnosis, summary: "deleteDiagnosis", responses: {'204': {description: Draft diagnosis deleted}, '409': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/media:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    post: {tags: [Diagnostics], operationId: uploadDiagnosticMedia, summary: "uploadDiagnosticMedia", requestBody: {$ref: '#/components/requestBodies/DiagnosticMedia'}, responses: {'201': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/media/{mediaId}:
    parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/MediaId'}]
    delete: {tags: [Diagnostics], operationId: deleteDiagnosticMedia, summary: "deleteDiagnosticMedia", responses: {'204': {description: Media removed}, '404': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/obd-snapshots:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    post: {tags: [Diagnostics], operationId: createObdSnapshot, summary: "createObdSnapshot", requestBody: {$ref: '#/components/requestBodies/Obd'}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/analyze:
    parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {tags: [Diagnostics], operationId: analyzeDiagnosis, summary: "analyzeDiagnosis", responses: {'202': {$ref: '#/components/responses/AnalysisAccepted'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/cancel:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    post: {tags: [Diagnostics], operationId: cancelDiagnosis, summary: "cancelDiagnosis", responses: {'200': {$ref: '#/components/responses/Diagnosis'}, '409': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/retry:
    parameters: [{$ref: '#/components/parameters/SessionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {tags: [Diagnostics], operationId: retryDiagnosis, summary: "retryDiagnosis", responses: {'202': {$ref: '#/components/responses/AnalysisAccepted'}, '409': {$ref: '#/components/responses/Error'}}}
  /diagnoses/{sessionId}/status:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    get: {tags: [Diagnostics], operationId: getDiagnosisStatus, summary: "getDiagnosisStatus", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/AnalysisStatus'}}}
  /diagnoses/{sessionId}/report:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    get: {tags: [Reports], operationId: getDiagnosisReport, summary: "getDiagnosisReport", responses: {'200': {$ref: '#/components/responses/Report'}, '409': {$ref: '#/components/responses/Error'}}}
  /reports:
    get: {tags: [Reports], operationId: listReports, summary: "Paginated report summaries", parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
  /reports/{reportId}:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get: {tags: [Reports], operationId: getReport, summary: "getReport", responses: {'200': {$ref: '#/components/responses/Report'}, '403': {$ref: '#/components/responses/Error'}}}
  /reports/{reportId}/feedback:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    post: {tags: [Reports], operationId: reportFeedback, summary: "reportFeedback", requestBody: {$ref: '#/components/requestBodies/ReportFeedback'}, responses: {'200': {$ref: '#/components/responses/Success'}, '201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /reports/{reportId}/follow-ups:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get: {tags: [Reports], operationId: listReportFollowUps, summary: "List report follow-up questions and answers", responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
    post: {tags: [Reports], operationId: createReportFollowUp, summary: "Ask a report follow-up with optional new photos", requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {question: {type: [string, 'null'], maxLength: 2000}, photos: {type: array, maxItems: 3, items: {type: string, format: binary}}}}}}}, responses: {'201': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /reports/{reportId}/maintenance-reminders:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    post: {tags: [Maintenance], operationId: createReportMaintenanceReminders, summary: "Convert report actions into idempotent maintenance reminders", requestBody: {required: true, content: {application/json: {schema: {type: object, required: [actionIds], properties: {actionIds: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Ulid'}}, dueDate: {type: [string, 'null'], format: date}, dueKm: {type: [integer, 'null'], minimum: 0}}}}}}, responses: {'200': {$ref: '#/components/responses/Success'}, '201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /reports/{reportId}/refresh-estimate:
    parameters: [{$ref: '#/components/parameters/ReportId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post: {tags: [Reports], operationId: refreshEstimate, summary: "refreshEstimate", responses: {'202': {$ref: '#/components/responses/Success'}, '429': {$ref: '#/components/responses/Error'}}}
  /reports/{reportId}/share:
    parameters: [{$ref: '#/components/parameters/ReportId'}]
    get: {tags: [Reports], operationId: shareReport, summary: "shareReport", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
  /shared/reports/{reportId}:
    parameters: [{$ref: '#/components/parameters/ReportId'}, {name: expires, in: query, required: true, schema: {type: integer}}, {name: signature, in: query, required: true, schema: {type: string}}, {name: locale, in: query, schema: {type: string, enum: [en, ar]}}]
    get: {tags: [Reports], operationId: getSharedReport, summary: "getSharedReport", security: [], responses: {'200': {$ref: '#/components/responses/Report'}, '403': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/maintenance:
    parameters: [{$ref: '#/components/parameters/VehicleId'}]
    get: {tags: [Maintenance], operationId: listMaintenance, summary: "listMaintenance", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Maintenance], operationId: createMaintenance, summary: "createMaintenance", requestBody: {$ref: '#/components/requestBodies/MaintenanceRecordCreate'}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/maintenance/{recordId}:
    parameters: [{$ref: '#/components/parameters/VehicleId'}, {$ref: '#/components/parameters/RecordId'}]
    get: {tags: [Maintenance], operationId: getMaintenance, summary: "getMaintenance", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
    patch: {tags: [Maintenance], operationId: updateMaintenance, summary: "updateMaintenance", requestBody: {$ref: '#/components/requestBodies/MaintenanceRecord'}, responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Maintenance], operationId: deleteMaintenance, summary: "deleteMaintenance", responses: {'400': {$ref: '#/components/responses/Error'}, '204': {description: Record deleted}}}
  /vehicles/{vehicleId}/maintenance-reminders:
    parameters: [{$ref: '#/components/parameters/VehicleId'}]
    get: {tags: [Maintenance], operationId: listMaintenanceReminders, summary: "listMaintenanceReminders", responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Maintenance], operationId: createMaintenanceReminder, summary: "createMaintenanceReminder", requestBody: {$ref: '#/components/requestBodies/MaintenanceReminderCreate'}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/maintenance-reminders/{reminderId}:
    parameters: [{$ref: '#/components/parameters/VehicleId'}, {$ref: '#/components/parameters/ReminderId'}]
    patch: {tags: [Maintenance], operationId: updateMaintenanceReminder, summary: "updateMaintenanceReminder", requestBody: {$ref: '#/components/requestBodies/MaintenanceReminder'}, responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/maintenance-reminders/{reminderId}/complete:
    parameters: [{$ref: '#/components/parameters/VehicleId'}, {$ref: '#/components/parameters/ReminderId'}]
    post: {tags: [Maintenance], operationId: completeMaintenanceReminder, summary: "completeMaintenanceReminder", requestBody: {$ref: '#/components/requestBodies/ReminderCompletion'}, responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /vehicles/{vehicleId}/maintenance-reminders/{reminderId}/snooze:
    parameters: [{$ref: '#/components/parameters/VehicleId'}, {$ref: '#/components/parameters/ReminderId'}]
    post: {tags: [Maintenance], operationId: snoozeMaintenanceReminder, summary: "snoozeMaintenanceReminder", requestBody: {$ref: '#/components/requestBodies/ReminderSnooze'}, responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}}
  /mechanics:
    get: {tags: [Mechanics], operationId: listMechanics, summary: "listMechanics", security: [], parameters: [{$ref: '#/components/parameters/Latitude'}, {$ref: '#/components/parameters/Longitude'}, {name: radiusKm, in: query, schema: {type: number, minimum: 1, maximum: 200}}, {name: specialty, in: query, schema: {type: string}}], responses: {'400': {$ref: '#/components/responses/Error'}, '200': {$ref: '#/components/responses/Success'}}}
  /mechanics/{mechanicId}:
    parameters: [{$ref: '#/components/parameters/MechanicId'}]
    get: {tags: [Mechanics], operationId: getMechanic, summary: "getMechanic", security: [], responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}}
  /mechanics/{mechanicId}/availability:
    parameters: [{$ref: '#/components/parameters/MechanicId'}]
    get: {tags: [Mechanics], operationId: getMechanicAvailability, summary: "Availability generated from the mechanic's timezone and working hours", security: [], parameters: [{name: date, in: query, description: "Mechanic-local calendar date; preferred by booking clients.", schema: {type: string, format: date}}, {name: from, in: query, schema: {type: string, format: date-time}}, {name: to, in: query, schema: {type: string, format: date-time}}, {name: slotMinutes, in: query, schema: {type: integer, enum: [30, 60, 90, 120], default: 60}}], responses: {'200': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /service-requests:
    get: {tags: [Service Requests], operationId: listServiceRequests, summary: "List the current user's workshop requests", parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Success'}}}
    post: {tags: [Service Requests], operationId: createServiceRequest, summary: "Request itemized quotes from one to three verified workshops", parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceRequestInput'}}}}, responses: {'201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /service-requests/{serviceRequestId}:
    parameters: [{$ref: '#/components/parameters/ServiceRequestId'}]
    get: {tags: [Service Requests], operationId: getServiceRequest, summary: "Get quotes, messages, and repair status", responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
  /service-requests/{serviceRequestId}/messages:
    parameters: [{$ref: '#/components/parameters/ServiceRequestId'}]
    post: {tags: [Service Requests], operationId: sendServiceRequestMessage, summary: "Send a participant message", requestBody: {required: true, content: {application/json: {schema: {type: object, required: [body], properties: {body: {type: string, maxLength: 3000}}}}}}, responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
  /service-requests/{serviceRequestId}/quotes/{quoteId}/accept:
    parameters: [{$ref: '#/components/parameters/ServiceRequestId'}, {$ref: '#/components/parameters/QuoteId'}]
    post: {tags: [Service Requests], operationId: acceptServiceQuote, summary: "Accept one available workshop quote", responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}}
  /mechanic/service-requests:
    get: {tags: [Service Requests], operationId: listMechanicServiceRequests, summary: "List requests sent to workshops owned by the current user", responses: {'200': {$ref: '#/components/responses/Success'}}}
  /mechanic/service-requests/{serviceRequestId}/quote:
    parameters: [{$ref: '#/components/parameters/ServiceRequestId'}]
    post: {tags: [Service Requests], operationId: submitServiceQuote, summary: "Submit or replace an itemized quote", requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceQuoteInput'}}}}, responses: {'200': {$ref: '#/components/responses/Success'}, '201': {$ref: '#/components/responses/Success'}, '422': {$ref: '#/components/responses/Error'}}}
  /mechanic/service-requests/{serviceRequestId}/status:
    parameters: [{$ref: '#/components/parameters/ServiceRequestId'}]
    patch: {tags: [Service Requests], operationId: updateServiceRequestStatus, summary: "Advance an accepted repair to in-service or completed", requestBody: {required: true, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string, enum: [in_service, completed]}}}}}}, responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}}
  /appointments:
    post: {tags: [Appointments], operationId: createAppointment, summary: "createAppointment", parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Appointment'}, responses: {'201': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}}

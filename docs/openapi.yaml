  /admin/ai-runs/{runId}/retry:
    parameters: [{$ref: '#/components/parameters/RunId'}]
    post: {tags: [Admin], operationId: adminRetryAiRun, summary: "adminRetryAiRun", responses: {'400': {$ref: '#/components/responses/Error'}, '202': {$ref: '#/components/responses/Success'}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: Sanctum}
  parameters:
    HealthType: {name: type, in: query, schema: {type: string, enum: [liveness, readiness]}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
    Latitude: {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
    Longitude: {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
    VehicleId: {name: vehicleId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    SessionId: {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ReportId: {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    MediaId: {name: mediaId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    RecordId: {name: recordId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ReminderId: {name: reminderId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    MechanicId: {name: mechanicId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    AppointmentId: {name: appointmentId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ServiceRequestId: {name: serviceRequestId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    QuoteId: {name: quoteId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    DeviceTokenId: {name: deviceTokenId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    MakeId: {name: makeId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    ServiceId: {name: serviceId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    RunId: {name: runId, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    MakeCode: {name: makeCode, in: path, required: true, schema: {type: string}}
    WebhookId: {name: webhook-id, in: header, required: true, schema: {type: string}}
    WebhookTimestamp: {name: webhook-timestamp, in: header, required: true, schema: {type: string}}
    WebhookSignature: {name: webhook-signature, in: header, required: true, schema: {type: string}}
  requestBodies:
    Register: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegisterRequest'}}}}
    Login: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
    OtpResend: {required: true, content: {application/json: {schema: {type: object, required: [verificationToken], properties: {verificationToken: {type: string, maxLength: 4096}}}}}}
    OtpVerify: {required: true, content: {application/json: {schema: {type: object, required: [verificationToken, code], properties: {verificationToken: {type: string, maxLength: 4096}, code: {type: string, pattern: '^\d{4,10}$'}, deviceName: {type: [string, 'null'], maxLength: 120}}}}}}
    SocialLogin: {required: true, content: {application/json: {schema: {type: object, required: [identityToken], properties: {identityToken: {type: string}, nonce: {type: [string, 'null'], description: "Required for Apple; send the raw nonce whose SHA-256 digest was included in the authorization request."}, name: {type: [string, 'null'], maxLength: 120, description: "Optional display name returned by Apple on first authorization."}, deviceName: {type: [string, 'null']}, termsAccepted: {type: boolean, description: "Required when this provider identity creates or first links an account."}, privacyAccepted: {type: boolean, description: "Required when this provider identity creates or first links an account."}, legalVersion: {type: string, example: '2026-08-11'}}}}}}
    Email: {required: true, content: {application/json: {schema: {type: object, required: [email], properties: {email: {type: string, format: email}}}}}}
    ResetPassword: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResetPasswordRequest'}}}}
    Avatar: {required: true, content: {multipart/form-data: {schema: {type: object, required: [avatar], properties: {avatar: {type: string, format: binary}}}}}}
    ProfileUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}}
    SettingsUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SettingsUpdateRequest'}}}}
    Device: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceRequest'}}}}
    Vehicle: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleInput'}}}}
    VehicleUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VehicleUpdateInput'}}}}
    Diagnosis: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosisInput'}}}}
    DiagnosisUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DiagnosisUpdateRequest'}}}}
    DiagnosticMedia: {required: true, content: {multipart/form-data: {schema: {type: object, required: [kind, file], properties: {kind: {type: string, enum: [photo, engine_sound, spoken_description]}, file: {type: string, format: binary}}}}}}
    Obd: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObdInput'}}}}
    ReportFeedback: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportFeedbackRequest'}}}}

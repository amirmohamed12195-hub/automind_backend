  /admin/labor-rate-sources:
    get: {tags: [Admin], operationId: adminListLaborRates, summary: "List versioned labor hours and hourly rates", parameters: [{name: countryCode, in: query, schema: {type: string, minLength: 2, maxLength: 2}}, {name: city, in: query, schema: {type: string}}, {name: serviceCategory, in: query, schema: {type: string}}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
    post:
      tags: [Admin]
      operationId: adminCreateLaborRate
      summary: Append a sourced or administrator-maintained labor basis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [countryCode, serviceCategory, hourlyLow, hourlyTypical, hourlyHigh, hoursLow, hoursTypical, hoursHigh, currency, observedAt]
              properties:
                countryCode: {type: string, minLength: 2, maxLength: 2}
                city: {type: [string, 'null']}
                serviceCategory: {type: string, description: Use a canonical part code or default for a whole-job basis.}
                hourlyLow: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                hourlyTypical: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                hourlyHigh: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                hoursLow: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                hoursTypical: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                hoursHigh: {type: string, pattern: '^\d+(?:\.\d{1,2})?$'}
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                observedAt: {type: string, format: date-time}
                expiresAt: {type: [string, 'null'], format: date-time}
      responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
  /admin/currency-rates:
    get: {tags: [Admin], operationId: adminListCurrencyRates, summary: "List configured currency-rate evidence", parameters: [{name: baseCurrency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}, {name: quoteCurrency, in: query, schema: {type: string, minLength: 3, maxLength: 3}}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}}
    post:
      tags: [Admin]
      operationId: adminCreateCurrencyRate
      summary: Append a sourced currency conversion rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseCurrency, quoteCurrency, rate, provider, effectiveAt]
              properties:
                baseCurrency: {type: string, pattern: '^[A-Z]{3}$'}
                quoteCurrency: {type: string, pattern: '^[A-Z]{3}$'}
                rate: {type: string, pattern: '^\d+(?:\.\d{1,10})?$'}
                provider: {type: string}
                effectiveAt: {type: string, format: date-time}
      responses: {'201': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '422': {$ref: '#/components/responses/Error'}}
